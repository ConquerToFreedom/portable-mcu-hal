name: verify-build

# Builds hardware-verification test firmware ONLY. No secrets are
# referenced anywhere in this workflow, and nothing here flashes a
# board or talks to HF·NODE — that happens later, from a developer's
# own machine, via scripts/verify.sh. See docs/verification/ and
# CLAUDE.md.

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  matrix-setup:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - id: set
        run: |
          pip install --quiet pyyaml
          python3 - <<'EOF' >> "$GITHUB_OUTPUT"
          import json, yaml
          with open("verify/targets.yml") as f:
              cfg = yaml.safe_load(f)
          entries = []
          for vendor, t in cfg["targets"].items():
              if not t.get("enabled"):
                  continue
              for test in t["tests"]:
                  entries.append({"vendor": vendor, "test": test["name"]})
          print("matrix=" + json.dumps({"include": entries}))
          EOF

  build:
    needs: matrix-setup
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.matrix-setup.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4

      - name: Install script dependencies
        run: pip install --quiet pyyaml

      # Caches the built image's layers (SDK download/install is the
      # expensive part) via GitHub Actions' own cache backend, so only
      # a Dockerfile/SDK-version change triggers a full re-download.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build firmware (no secrets, no flashing)
        env:
          DOCKER_BUILD_EXTRA_ARGS: >-
            --cache-from=type=gha,scope=${{ matrix.vendor }}
            --cache-to=type=gha,mode=max,scope=${{ matrix.vendor }}
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          scripts/build.sh "${{ matrix.vendor }}" "${{ matrix.test }}" "$SHORT_SHA"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.vendor }}-${{ matrix.test }}
          path: out/${{ matrix.vendor }}/${{ matrix.test }}.*
          if-no-files-found: error
